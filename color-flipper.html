<!DOCTYPE html>
<html>
<head>
  <title>Animated Color Flipper</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 100px;
      background: linear-gradient(135deg, #98e2ff 0%, #eec0fc 100%);
      min-height: 100vh;
      transition: background 0.6s ease;
    }
    #colorBox {
      width: 300px;
      height: 150px;
      margin: 30px auto;
      background: #eee;
      line-height: 150px;
      font-size: 2em;
      color: #fff;
      border: 2px solid #88a;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(70,130,180,0.18);
      transition: background 0.6s ease, color 0.6s ease, transform 0.35s cubic-bezier(.68,-0.55,.27,1.55);
    }
    .flip {
      transform: scale(1.1) rotate(-3deg);
    }
    button {
      padding: 10px 28px;
      font-size: 1.2em;
      cursor: pointer;
      background: #3489db;
      color: #fff;
      border: none;
      border-radius: 6px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      transition: background 0.3s;
    }
    button:hover {
      background: #276cbc;
    }
  </style>
</head>
<body>
  <h1>Color Flipper with Animation</h1>
  <div id="colorBox">#eee</div>
  <button onclick="flipColor()">Flip Color</button>
  <script>
    const colors = [
      "#FF5733", "#33FF57", "#3357FF", "#F3FF33", "#FF33A8",
      "#33FFF3", "#A833FF", "#FFD700", "#40E0D0", "#8B0000"
    ];

    function flipColor() {
      let randomIndex = Math.floor(Math.random() * colors.length);
      let color = colors[randomIndex];


      let colorBox = document.getElementById('colorBox');
      colorBox.classList.add('flip');
      setTimeout(() => colorBox.classList.remove('flip'), 400);

 
      colorBox.style.backgroundColor = color;
      colorBox.textContent = color;

      colorBox.style.color = (randomIndex === 1 || randomIndex === 3 || randomIndex === 7) ? "#333" : "#fff";

  
      document.body.style.background = `linear-gradient(135deg, ${color} 0%, #eec0fc 100%)`;
    }
  </script>
</body>
</html>
